title: Security Tool Killer Execution
id: 468d13d2-85ff-4e6e-9c4e-dee1602d5efe
status: experimental
description: Detects HRSword, the Huorong anti-rootkit utility that ransomware operators run to kill endpoint protection before encrypting. PCHunter and Process Hacker are left to SigmaHQ (HackTool - PCHunter Execution, PUA - Process Hacker Execution) and to the engine's suspicious tools list.
references:
  - https://attack.mitre.org/techniques/T1685/
author: MarcBernaldo
date: 2026-11-06
modified: 2026-11-08
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\HRSword.exe'
  condition: selection
falsepositives:
  - Malware analysts and incident responders using these tools on purpose
  - Hosts that run Huorong Internet Security, which ships HRSword
level: high
# test-match: Image="C:\Users\Public\HRSword.exe" CommandLine="HRSword.exe"
# test-match: Image="C:\ProgramData\hr\HRSword.exe"
# test-nomatch: Image="C:\Windows\System32\notepad.exe" CommandLine="notepad.exe C:\Users\jdoe\Downloads\HRSword.exe"
# beyond-sigmahq: SigmaHQ has no HRSword rule; PCHunter and Process Hacker were dropped from this rule because SigmaHQ covers them
