title: LSASS Memory Dump via Comsvcs MiniDump or Procdump-Style Arguments
id: 846002a7-ff2f-4556-bc06-761b9ec68c27
status: experimental
description: Detects dumping of LSASS memory with rundll32 and comsvcs.dll MiniDump, or with any tool given the Sysinternals full-dump switch against lsass. The dump holds credentials and NTLM hashes, so a hit means every account logged on to the host must be treated as compromised.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Marc
date: 2026-11-07
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_comsvcs:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains: 'comsvcs'
    selection_comsvcs_export:
        CommandLine|contains:
            - 'MiniDump'
            - '#24'
    selection_fulldump_switch:
        CommandLine|windash|contains: ' -ma '
    selection_fulldump_target:
        CommandLine|contains: 'lsass'
    condition: (selection_comsvcs and selection_comsvcs_export) or (selection_fulldump_switch and selection_fulldump_target)
falsepositives:
    - Microsoft support asking for an LSASS dump with procdump during a case (rare, should be documented)
level: critical
# test-match: Image="C:\Windows\System32\rundll32.exe" CommandLine="rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump 624 C:\Windows\Temp\out.dmp full"
# test-match: Image="C:\Users\Public\pd64.exe" CommandLine="pd64.exe -accepteula -ma lsass.exe C:\Windows\Temp\l.dmp"
# test-nomatch: Image="C:\Windows\System32\rundll32.exe" CommandLine="rundll32.exe shell32.dll,Control_RunDLL desk.cpl"
