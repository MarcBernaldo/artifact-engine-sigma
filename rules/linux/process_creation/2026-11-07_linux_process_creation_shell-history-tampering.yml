title: Shell History Cleared or Disabled
id: 17084af3-11c6-44d2-b96d-0c57d9ff6ba0
status: experimental
description: Detects commands that clear, delete or disable shell history (history -c, unset HISTFILE, HISTFILE=/dev/null, removing or linking .bash_history to /dev/null). Attackers do this to hide what they ran, so a hit tells the analyst the history is incomplete and the activity around it deserves a closer look.
references:
    - https://attack.mitre.org/techniques/T1070/003/
author: Marc
date: 2026-11-07
tags:
    - attack.stealth
    - attack.t1070.003
logsource:
    product: linux
    category: process_creation
detection:
    selection_builtin:
        CommandLine|contains:
            - 'history -c'
            - 'history -w /dev/null'
            - 'unset HISTFILE'
            - 'HISTFILE=/dev/null'
            - 'HISTFILESIZE=0'
            - 'HISTSIZE=0'
            - 'set +o history'
    selection_file:
        CommandLine|contains: '_history'
    selection_file_action:
        CommandLine|contains:
            - 'rm '
            - 'shred '
            - 'truncate '
            - 'ln -s'
            - '/dev/null >'
            - '/dev/null>'
            - ': > '
            - 'echo > '
    condition: selection_builtin or (selection_file and selection_file_action)
falsepositives:
    - Admins clearing history after typing a password on the command line
    - Hardening or golden-image scripts that wipe history before templating a VM
level: high
# test-match: CommandLine="unset HISTFILE"
# test-match: CommandLine="ln -sf /dev/null ~/.bash_history"
# test-match: CommandLine="shred -u /root/.bash_history"
# test-match: CommandLine="cat /dev/null > ~/.bash_history"
# test-nomatch: CommandLine="cat ~/.bash_history | grep ssh"
