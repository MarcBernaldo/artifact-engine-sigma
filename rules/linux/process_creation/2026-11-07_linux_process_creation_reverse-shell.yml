title: Linux Reverse Shell One-Liner in Shell History or Process List
id: 54c21f6a-ac75-4775-9e3c-a751f49aac45
status: experimental
description: Detects the classic reverse shell one-liners (bash /dev/tcp, netcat -e, mkfifo pipe shells, socat exec, Python or Perl socket shells) in shell history or the captured process list. A hit is the attacker's interactive access to the host and usually points to the exploited service or account.
references:
    - https://attack.mitre.org/techniques/T1059/004/
author: Marc
date: 2026-11-07
tags:
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_devtcp:
        CommandLine|contains:
            - '/dev/tcp/'
            - '/dev/udp/'
    selection_devtcp_interactive:
        CommandLine|contains:
            - ' -i'
            - '0>&1'
            - '0<&'
            - '<&196'
    selection_netcat_exec:
        CommandLine|contains:
            - 'nc -e /bin/'
            - 'nc -c /bin/'
            - 'ncat -e /bin/'
            - 'ncat --exec'
            - 'ncat --sh-exec'
            - 'nc.traditional -e'
    selection_fifo:
        CommandLine|contains:
            - '/bin/sh -i 2>&1'
            - '/bin/bash -i 2>&1'
            - 'sh -i 2>&1'
    selection_socat:
        CommandLine|contains|all:
            - 'socat'
            - 'exec:'
    selection_script_socket:
        CommandLine|contains|all:
            - 'socket'
            - 'connect('
            - '/bin/'
    condition: (selection_devtcp and selection_devtcp_interactive) or selection_netcat_exec or selection_fifo or selection_socat or selection_script_socket
falsepositives:
    - Penetration testers and CTF practice on the host
    - Admins testing a port with bash /dev/tcp (normally without -i or 0>&1, so not matched)
level: critical
