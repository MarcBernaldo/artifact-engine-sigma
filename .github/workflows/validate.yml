name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "pySigma>=1.4,<2" "pySigma-backend-sqlite>=1.2,<3" pyyaml
      - run: python tools/validate.py
